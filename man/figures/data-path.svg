<text class="s" x="566" y="154" fill="#6FD4F0" font-size="20" text-anchor="start">the filter and the column list go with it</text>
<text class="s" x="40" y="190" fill="#8FB6D1" font-size="19" font-weight="600" letter-spacing="2.5">ICEBERG-RUST 0.10</text>
<rect x="40" y="208" width="341" height="54" rx="10" fill="#0C2B45" stroke="#1E4E75" stroke-width="2"/>
<text class="s" x="210" y="243" fill="#EAF5FC" font-size="21" text-anchor="middle">plan the scan</text>
