<rect x="409" y="208" width="341" height="54" rx="10" fill="#0C2B45" stroke="#1E4E75" stroke-width="2"/>
<text class="s" x="580" y="243" fill="#EAF5FC" font-size="21" text-anchor="middle">prune files, then row groups</text>
