on:
  push:
    branches: [main, master]
    paths:
      - 'R/**'
      - 'DESCRIPTION'
      - '.github/workflows/document.yaml'
  workflow_dispatch:

name: document

# man/*.Rd and NAMESPACE are derived from the roxygen comments in R/. Rather than
# expecting them to be regenerated by hand and drift when they are not, this
# generates and commits them.
permissions:
  contents: write

jobs:
  document:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::roxygen2
          needs: roxygen2

      # load_code = "source" so that documentation can be generated without a
      # Rust toolchain and a full compile.
      - name: Generate documentation
        run: roxygen2::roxygenise(load_code = "source")
        shell: Rscript {0}

      - name: Commit if anything changed
        run: |
          git config --local user.name "$GITHUB_ACTOR"
          git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"
          # DESCRIPTION too: roxygen2 records the version it ran as, so leaving
          # it out makes every run rewrite a file it never commits.
          git add man/ NAMESPACE DESCRIPTION
          if git diff --staged --quiet; then
            echo "Documentation is already up to date."
          else
            git commit -m "Regenerate documentation from roxygen comments"
            git push
          fi
        shell: bash
