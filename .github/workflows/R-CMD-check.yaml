on:
  push:
    branches: [main, master]
  pull_request:
  # The full platform matrix runs here rather than on every push. See the note
  # on billing below. Scheduled runs only fire on the default branch, and GitHub
  # disables them after 60 days without repository activity.
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
    inputs:
      rust_only:
        description: >
          Run only the Rust type-check. One short job instead of eight, for
          iterating on src/rust/ without spending the full matrix.
        type: boolean
        default: false

name: R-CMD-check

permissions: read-all

# A full run compiles ~308 crates per platform, so superseding an in-flight run
# avoids paying for a stale commit's matrix alongside the current one. Note that
# cancelling stops the clock but does not refund what has already run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which platforms this run covers, decided from the event.
  #
  # The reason is billing rather than taste. GitHub charges macOS minutes at 10x
  # and Windows at 2x, and this package compiles ~308 Rust crates from cold on
  # every run. Measured over 22 runs: macOS was 56% of the bill and Windows 18%
  # -- three quarters of it, from two of seven jobs. macOS is actually the
  # *fastest* platform in wall clock, around nine minutes. It is purely the
  # multiplier.
  #
  # So a push gets Linux only, and the full matrix runs weekly, on pull requests
  # and on demand. Dispatch it by hand before anything that matters, a CRAN
  # submission above all.
  #
  # Built in a job rather than inline: a `fromJSON` expression long enough to
  # hold four configurations has to be one unbroken line, because a GitHub
  # expression string literal cannot span lines.
  plan:
    runs-on: ubuntu-latest
    if: inputs.rust_only != true
    outputs:
      config: ${{ steps.pick.outputs.config }}
    steps:
      - id: pick
        shell: bash
        run: |
          # lto/cgu override [profile.release] for the run. Turning LTO off and
          # raising codegen-units is where most of a release build's time goes,
          # and it is still a release build -- same opt-level, same stripped
          # symbols -- so the checks see what they are meant to see.
          #
          # A debug build was tried instead and is not usable here: it leaves
          # src/rust/target inside the package (nothing cleans it without
          # @CLEAN_TARGET@), so check then scans build-script C output and
          # reports line-ending and pragma NOTEs, and the unoptimised staticlib
          # still contains exit/abort/stderr, which trips "checking compiled
          # code". Measured: 3 WARNINGs and 3 NOTEs, against 0 for this.
          #
          # The Linux legs run on every push, so they take the faster build.
          # macOS and Windows run rarely and exist for build fidelity, so they
          # keep the profile the package actually ships.
          linux='{"os":"ubuntu-latest","r":"release","lto":"false","cgu":"16"}'
          # DESCRIPTION declares R (>= 4.2), so an older R has to be exercised
          # or the floor is a guess.
          oldrel='{"os":"ubuntu-latest","r":"oldrel-1","lto":"false","cgu":"16"}'
          mac='{"os":"macos-latest","r":"release","lto":"true","cgu":"1"}'
          win='{"os":"windows-latest","r":"release","lto":"true","cgu":"1"}'

          if [ "${{ github.event_name }}" = "push" ]; then
            config="[$linux,$oldrel]"
          else
            config="[$linux,$oldrel,$mac,$win]"
          fi
          echo "Platforms for this ${{ github.event_name }} run: $config"
          echo "config=$config" >> "$GITHUB_OUTPUT"

  # Broad platform coverage. Cargo is allowed to resolve dependencies from the
  # network here (NOT_CRAN=true), which is the fast path and the primary signal
  # that the bindings compile and the tests pass on every platform.
  check:
    needs: plan
    runs-on: ${{ matrix.config.os }}
    if: inputs.rust_only != true

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.plan.outputs.config) }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true
      # Set explicitly on every leg rather than left blank on some: cargo
      # rejects an empty value for a profile override.
      CARGO_PROFILE_RELEASE_LTO: ${{ matrix.config.lto }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ matrix.config.cgu }}
      # Cargo defaults to every logical CPU, which is more than a CI runner
      # should use and more than CRAN permits.
      CARGO_BUILD_JOBS: 2
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # R on Windows links against the mingw-w64 toolchain, so the Rust side has
      # to be built for the gnu target rather than the default msvc one.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'Windows' && 'x86_64-pc-windows-gnu' || '' }}

      - name: Report toolchain versions
        run: |
          rustc --version
          cargo --version
        shell: bash

      # There is deliberately no cargo cache here, and there cannot usefully be
      # one. It was tried: across 19 runs the step never wrote a single entry,
      # so it never produced a hit either -- it was pure overhead dressed up as
      # an optimisation. Three separate reasons, any one of which is fatal:
      #
      #   * src/Makevars sets CARGO_HOME to a directory inside the build tree,
      #     as CRAN requires, and deletes it afterwards, so ~/.cargo is never
      #     written by the package build.
      #   * R CMD check compiles inside check/icebergr.Rcheck/00_pkg_src/, not
      #     in the checked-out tree, so a repo-relative src/rust/target is not
      #     the directory cargo is building into.
      #   * check unpacks the sources fresh each run, so every fingerprint cargo
      #     would compare against is new anyway.
      #
      # The cargo-check and cargo-extras jobs below invoke cargo directly rather
      # than through R, so caching does work there, and they do cache.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::roxygen2
          needs: check

      # man/ is generated, not committed: the .Rd files are derived from the
      # roxygen comments and regenerating them here keeps the two from drifting.
      - name: Generate documentation
        run: roxygen2::roxygenise(load_code = "source")
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          # Vignettes are deliberately not built here; the vendored job below
          # builds and checks them on the CRAN path. --no-build-vignettes has to
          # be paired with --ignore-vignettes, though: otherwise check reports
          # the missing inst/doc as a WARNING, and this action stops on warnings.
          build_args: 'c("--no-manual", "--no-build-vignettes")'
          args: 'c("--no-manual", "--as-cran", "--ignore-vignettes")'

      # When the install step fails, R CMD check only says "see 00install.out"
      # — and that file is inside the uploaded artefact, not the log. For a
      # package whose install compiles Rust, the compiler errors are the whole
      # point, so print them.
      - name: Show install and test logs on failure
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          if [ "$RUNNER_OS" = "macOS" ]; then
            # An install WARNING here is usually the SDK/deployment-target
            # mismatch between cargo's C dependencies and R's own link step.
            echo "================== macOS toolchain =================="
            sw_vers || true
            echo "SDK: $(xcrun --show-sdk-version 2>/dev/null || echo unknown)"
            echo "MACOSX_DEPLOYMENT_TARGET=[${MACOSX_DEPLOYMENT_TARGET}]"
            echo "R CC:     $(R CMD config CC 2>/dev/null || true)"
            echo "R CFLAGS: $(R CMD config CFLAGS 2>/dev/null || true)"
            grep -nE 'mmacosx-version-min|DEPLOYMENT_TARGET' \
              "$(R RHOME)/etc/Makeconf" || echo "(no version-min in Makeconf)"
          fi
          echo "===================== check tree ====================="
          ls -R check 2>/dev/null | head -40 || echo "(no check/ directory)"
          # The head of 00install.out carries configure's decisions, which is
          # what you need when the install warns; the tail is usually thousands
          # of compiler lines.
          for f in check/*.Rcheck/00install.out; do
            echo "===================== $f (head) ====================="
            head -60 "$f"
            echo "--- lines matching 'built for newer': $(grep -c 'built for newer' "$f" || true)"
          done
          # 00check.log truncates test output to the last 13 lines, which is
          # rarely the failure you need. *.Rout.fail holds the whole run.
          for f in check/*.Rcheck/00check.log check/*.Rcheck/tests/*.Rout.fail; do
            echo "===================== $f ====================="
            cat "$f"
          done

  # The CRAN-shaped path: vendor every crate, then build with no network access
  # at all. This is what would actually be submitted, and it is also where the
  # vendored tarball gets measured rather than estimated.
  check-vendored:
    runs-on: ubuntu-latest
    if: inputs.rust_only != true
    name: vendored offline build (CRAN path)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CARGO_BUILD_JOBS: 2
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::roxygen2
          needs: check

      - name: Generate documentation
        run: roxygen2::roxygenise(load_code = "source")
        shell: Rscript {0}

      # Needs the network; everything after this point must not.
      - name: Vendor Rust dependencies
        run: Rscript tools/vendor.R

      - name: Report vendored size
        run: |
          set -e
          ls -la src/rust/vendor.tar.xz
          size_mb=$(du -m src/rust/vendor.tar.xz | cut -f1)
          crates=$(grep -c '^Name:' LICENSE.note || echo "unknown")
          echo "### Vendored dependencies" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`vendor.tar.xz\`: ${size_mb} MB" >> "$GITHUB_STEP_SUMMARY"
          echo "- crates: ${crates}" >> "$GITHUB_STEP_SUMMARY"
          echo "- CRAN guidance is 10 MB; the largest exception granted to date is 13.6 MB." >> "$GITHUB_STEP_SUMMARY"
          if [ "$size_mb" -gt 10 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "This exceeds CRAN's preferred limit. See FEASIBILITY.md." >> "$GITHUB_STEP_SUMMARY"
          fi
        shell: bash

      # NOT_CRAN is deliberately unset, so configure passes --offline to cargo
      # and the build fails if anything tries to reach the network.
      - name: Check with vendored, offline build
        run: |
          options(crayon.enabled = TRUE)
          rcmdcheck::rcmdcheck(
            args = c("--no-manual", "--as-cran"),
            build_args = c("--no-manual"),
            error_on = "warning",
            check_dir = "check"
          )
        shell: Rscript {0}

      - name: Show install and test logs on failure
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          if [ "$RUNNER_OS" = "macOS" ]; then
            # An install WARNING here is usually the SDK/deployment-target
            # mismatch between cargo's C dependencies and R's own link step.
            echo "================== macOS toolchain =================="
            sw_vers || true
            echo "SDK: $(xcrun --show-sdk-version 2>/dev/null || echo unknown)"
            echo "MACOSX_DEPLOYMENT_TARGET=[${MACOSX_DEPLOYMENT_TARGET}]"
            echo "R CC:     $(R CMD config CC 2>/dev/null || true)"
            echo "R CFLAGS: $(R CMD config CFLAGS 2>/dev/null || true)"
            grep -nE 'mmacosx-version-min|DEPLOYMENT_TARGET' \
              "$(R RHOME)/etc/Makeconf" || echo "(no version-min in Makeconf)"
          fi
          echo "===================== check tree ====================="
          ls -R check 2>/dev/null | head -40 || echo "(no check/ directory)"
          # The head of 00install.out carries configure's decisions, which is
          # what you need when the install warns; the tail is usually thousands
          # of compiler lines.
          for f in check/*.Rcheck/00install.out; do
            echo "===================== $f (head) ====================="
            head -60 "$f"
            echo "--- lines matching 'built for newer': $(grep -c 'built for newer' "$f" || true)"
          done
          # 00check.log truncates test output to the last 13 lines, which is
          # rarely the failure you need. *.Rout.fail holds the whole run.
          for f in check/*.Rcheck/00check.log check/*.Rcheck/tests/*.Rout.fail; do
            echo "===================== $f ====================="
            cat "$f"
          done

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vendored-check-results
          path: check
          retention-days: 7

  # The filter translator and argument checking are pure R. Running them without
  # a Rust build gives a fast signal, and proves the "Rust artefacts missing"
  # path degrades gracefully rather than crashing.
  lint:
    runs-on: ubuntu-latest
    if: inputs.rust_only != true
    name: R code style
    # Advisory: style is worth knowing about, but it should never be the reason a
    # real failure elsewhere goes unnoticed.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # roxygen2 is needed even though nothing is documented here: styler styles
      # the code inside roxygen @examples blocks and errors without it, leaving
      # `changed` full of NAs.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::styler, any::roxygen2
          needs: styler

      - name: Check R code style
        run: |
          changed <- styler::style_pkg(dry = "on")
          unstyled <- which(!is.na(changed$changed) & changed$changed)
          if (length(unstyled)) {
            cat("These files are not styled:\n")
            cat(paste0("  ", changed$file[unstyled], collapse = "\n"), "\n")
            quit(status = 1)
          }
          cat("All files are styled.\n")
        shell: Rscript {0}

  # The primary Rust signal, deliberately on its own: this type-checks every
  # binding against iceberg-rust's real API, which is the single most
  # informative thing CI does. Kept separate from clippy and the optional-feature
  # build so its result lands as soon as it is known rather than after another
  # half-hour of compiling.
  #
  # Our crate compiles last, after ~343 dependencies, so a type error in
  # src/rust/ only surfaces near the end. Budget accordingly.
  cargo-check:
    runs-on: ubuntu-latest
    name: cargo check (type-check bindings)
    timeout-minutes: 90

    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v4

      # R is required even for `cargo check`: extendr-api's build script reads
      # R_HOME to generate its bindings, and panics with a bare
      # `VarError::NotPresent` if R is absent. Not a linking requirement -- a
      # build-script one.
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/rust/target
          key: ubuntu-cargo-check-${{ hashFiles('src/rust/Cargo.toml') }}
          restore-keys: ubuntu-cargo-check-

      # Cheap, and a formatting failure should not hide a type error, so it runs
      # first but does not gate the check below.
      - name: cargo fmt
        continue-on-error: true
        run: cargo fmt --manifest-path src/rust/Cargo.toml --check

      # `cargo check` type-checks without linking, which is the fast way to find
      # mistakes in our own bindings.
      - name: cargo check (default features)
        run: cargo check --manifest-path src/rust/Cargo.toml --all-targets

  # Secondary Rust checks. Slower and less urgent than the type-check above.
  cargo-extras:
    runs-on: ubuntu-latest
    if: inputs.rust_only != true
    name: cargo clippy and optional features
    timeout-minutes: 90

    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v4

      # As above: extendr-api's build script needs R_HOME even for cargo check.
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/rust/target
          key: ubuntu-cargo-extras-${{ hashFiles('src/rust/Cargo.toml') }}
          restore-keys: ubuntu-cargo-extras-

      - name: cargo clippy
        run: cargo clippy --manifest-path src/rust/Cargo.toml -- -D warnings

      # Glue pulls in the AWS SDK and opendal, roughly 517 crates in total.
      - name: cargo check (glue feature)
        run: cargo check --manifest-path src/rust/Cargo.toml --features glue --all-targets
